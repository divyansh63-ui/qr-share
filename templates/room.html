<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room {{room_id}} • QR Share</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><a href="/" class="brand">⚡ QR Share</a><span class="expiry">Expires: {{expires}}</span></header><section class="roomhead"><div><h1>Room {{room_id}}</h1><p>Share this link with friends anywhere.</p></div><div class="qr"><img src="/static/qr_{{room_id}}.png"><small>Scan to join</small></div></section><section class="card share"><input id="link" value="{{share_url}}" readonly><button onclick="copyLink()">Copy link</button></section><section class="grid"><div class="card"><h2>Upload files</h2><div id="dropzone"><b>📁 Drop files here</b><span>or</span><button onclick="picker.click()" type="button">Choose files</button><input id="picker" type="file" multiple hidden></div><div id="prog" class="hidden"><div class="progress"><i id="bar"></i></div><span id="pt"></span></div></div><div class="card"><h2>Files in room</h2><div id="files"></div></div></section><footer>⚡ QR Share • Files are automatically removed after expiry</footer></main><script>const ROOM="{{room_id}}";</script><script src="/static/script.js"></script></body></html>
