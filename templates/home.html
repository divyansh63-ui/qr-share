<!doctype html>

<html> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>QR Share</title> <link rel="stylesheet" href="/static/style.css"> </head>

<body> <main class="home">

<div class="hero">
    <div class="logo">⚡</div>
    <h1>QR Share</h1>
    <p>Private, simple file sharing with anyone.</p>
</div>

{% if error %}
<div style="
    background:#fff1f2;
    color:#be123c;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
">
    {{ error }}
</div>
{% endif %}

<section class="card">

    <h2>Create a sharing room</h2>

    <form action="/create" method="post">

        <label>
            Room password
            <span>(optional)</span>
        </label>

        <input
            name="password"
            placeholder="Leave empty for public room"
        >

        <label>Files expire after</label>

        <select name="hours">
            <option value="1">1 hour</option>
            <option value="6">6 hours</option>
            <option value="24" selected>24 hours</option>
            <option value="72">3 days</option>
            <option value="168">7 days</option>
        </select>

        <button type="submit">
            Create Room →
        </button>

    </form>

</section>


<section class="card" style="margin-top:18px">

    <h2>Join a Room</h2>

    <form action="/join" method="post">

        <label>Room ID</label>

        <input
            name="room_id"
            placeholder="Example: ABCD1234"
            required
            style="text-transform:uppercase"
        >

        <label>
            Password
            <span>(if required)</span>
        </label>

        <input
            name="password"
            type="password"
            placeholder="Enter room password"
        >

        <button type="submit">
            Join Room →
        </button>

    </form>

</section>

<p class="note">
    No accounts • Join using Room ID • Share files securely
</p>

</main> </body> </html>
